<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick order</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first order sheet. Brand band, sticky category chips, menu rows with steppers,
   a cart bar pinned to the bottom, then a checkout sheet and a confirmation screen. */
:root{
  --bg:#F3F6F3; --surface:#FFFFFF; --surface-2:#EEF3EF; --ink:#14211C; --muted:#5B6B63; --line:#DCE4DE;
  --brand:#0D5A42; --brand-ink:#FFFFFF; --accent:#F2B705; --accent-ink:#1D1600;
  --ok:#1F8A4C; --bad:#C93A25; --wa:#25D366; --wa-ink:#062B14;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --surface-2:#1C2924; --ink:#E6EEE9; --muted:#97A89F; --line:#2A3A33;
  --brand:#2FA77B; --brand-ink:#05140E; --accent:#F5C430; --accent-ink:#1D1600; --ok:#4CC27F; --bad:#EF6A52;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface-2:#1C2924; --ink:#E6EEE9; --muted:#97A89F; --line:#2A3A33;
  --brand:#2FA77B; --brand-ink:#05140E; --accent:#F5C430; --accent-ink:#1D1600; --ok:#4CC27F; --bad:#EF6A52;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.5px;margin:0;line-height:1.05}

/* Brand band */
.band{background:var(--brand);color:var(--brand-ink)}
.band .wrap{padding-block:18px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.logo{font-family:var(--f-display);font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:1px}
.logo span{background:var(--accent);color:var(--accent-ink);padding:0 5px;margin-left:1px}
.band small{display:block;font-size:13px;opacity:.85;margin-top:6px}
.band .tag{font-family:var(--f-display);font-size:18px;color:var(--accent);text-align:right}

/* Category chips */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Menu */
.section-title{margin:22px 0 10px;font-size:22px}
.menu{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.item.in-cart{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.item b{font-size:16.5px;line-height:1.25}
.item .desc{font-size:13.5px;color:var(--muted);grid-column:1}
.item .price{font-weight:800;font-size:16px}
.item.out{opacity:.55}
.item.out .price::after{content:" · Sold out";color:var(--bad);font-weight:700;font-size:13px}
.step{grid-row:1 / span 3;grid-column:2;display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:0;font-size:22px;font-weight:800;line-height:1;background:var(--surface-2);color:var(--ink)}
.step button.add{background:var(--accent);color:var(--accent-ink)}
.step span{min-width:22px;text-align:center;font-weight:800}

/* Cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cartbar .wrap{display:flex}
.big{flex:1;border:0;border-radius:999px;padding:16px 20px;font-weight:800;font-size:17px;background:var(--brand);color:var(--brand-ink);display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.big:disabled{opacity:.5;cursor:not-allowed}
.big .pill{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px;font-size:14px}

/* Checkout */
.sheet{padding-block:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.card h2{font-size:20px}
.line{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.line small{display:block;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}
.total strong{font-family:var(--f-display);font-weight:400;font-size:30px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.field input,.field textarea{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);font-weight:500;font-size:16px;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:2px}
.opt small{font-weight:500;color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.opts{display:flex;flex-direction:column;gap:8px}
.back{background:none;border:0;padding:0;font-weight:700;color:var(--brand);margin-bottom:12px}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}

/* Notices + done */
.notice{text-align:center;padding-block:48px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.notice h2{font-size:30px}
.notice p{color:var(--muted);max-width:36ch;margin:0}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:44px;font-weight:800}
.tick.wait{background:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92)}}
.btn-wa{display:inline-flex;gap:10px;align-items:center;justify-content:center;background:var(--wa);color:var(--wa-ink);border-radius:999px;padding:14px 22px;font-weight:800;text-decoration:none}
.skeleton{height:84px;border-radius:var(--r);background:var(--surface-2);animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script src="../config.js?v=mvim2vl5"></script>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div><div class="logo" id="logo"></div><small id="shop-line"></small></div>
    <div class="tag">Quick<br>order</div>
  </div>
</header>

<!-- Menu -->
<section id="v-menu" hidden>
  <nav class="cats" aria-label="Menu sections"><div class="wrap" id="cats"></div></nav>
  <div class="wrap"><div id="menu"><div class="menu"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div></div>
  <div class="cartbar"><div class="wrap"><button class="big" id="to-checkout" disabled><span id="cart-count">Add something tasty</span><span class="pill num" id="cart-total">R0</span></button></div></div>
</section>

<!-- Checkout -->
<section id="v-checkout" class="sheet" hidden>
  <div class="wrap">
    <button class="back" id="back">‹ Back to the menu</button>
    <div class="card">
      <h2>Your order</h2>
      <div id="sum-lines"></div>
      <div class="total"><span>Total</span><strong class="num" id="sum-total">R0</strong></div>
    </div>
    <div class="card">
      <h2>Collect or delivery?</h2>
      <div class="seg">
        <button class="opt" data-ful="collect" aria-pressed="true">Collect<small id="collect-at"></small></button>
        <button class="opt" data-ful="delivery" aria-pressed="false">Delivery<small id="del-fee"></small></button>
      </div>
      <label class="field" for="c-addr" id="addr-wrap" hidden>Delivery address<input id="c-addr" autocomplete="street-address" placeholder="House number, street, area, landmark"></label>
      <label class="field" for="c-name">Name for the order<input id="c-name" autocomplete="given-name" maxlength="60" placeholder="e.g. Sipho"></label>
      <label class="field" for="c-note">Anything for the kitchen? (optional)<input id="c-note" maxlength="200" placeholder="e.g. no atchar, extra chilli"></label>
    </div>
    <div class="card">
      <h2>How will you pay?</h2>
      <div class="opts" id="pay-opts"></div>
    </div>
    <div class="err" id="err" role="alert" hidden></div>
  </div>
  <div class="cartbar"><div class="wrap"><button class="big" id="place"><span id="place-label">Place order</span><span class="pill num" id="place-total">R0</span></button></div></div>
</section>

<!-- Messages: bad link, done, paying -->
<section id="v-note" hidden><div class="wrap"><div class="notice" id="note"></div></div></section>

<script>
const CFG = window.SHOP_CONFIG || {};
const SHOP = CFG.name || "Shop";
const ORDER = CFG.webOrder || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R = n => "R" + (Math.round(Number(n) * 100) / 100).toLocaleString("en-ZA", {minimumFractionDigits:0, maximumFractionDigits:2});
const cents = n => Math.round(Number(n) * 100);
const CAT_NAME = Object.fromEntries((CFG.categories || []).map(c => [c.id, c.label]));
const q = new URLSearchParams(location.search);
const LINK = {p:q.get("p") || "", e:q.get("e") || "", t:q.get("t") || ""};
const WA = String(ORDER.whatsapp || "").replace(/\D/g, "");
const waLink = text => WA ? `https://wa.me/${WA}?text=${encodeURIComponent(text)}` : null;

/* Brand */
(() => {
  const text = CFG.logo?.text || SHOP, hi = CFG.logo?.highlight || "";
  const cut = hi && text.toUpperCase().endsWith(hi.toUpperCase()) ? text.length - hi.length : text.length;
  $("#logo").innerHTML = esc(text.slice(0, cut)) + (cut < text.length ? `<span>${esc(text.slice(cut))}</span>` : "");
  $("#shop-line").textContent = CFG.receipt?.address || "";
  document.title = `${SHOP} · Quick order`;
})();

let menu = [], cat = null, cart = {}, conf = null, fulfilment = "collect", pay = "cash", busy = false;
const cartKey = "order-cart-" + LINK.p;
try{ cart = JSON.parse(localStorage.getItem(cartKey) || "{}"); }catch(e){}
const saveCart = () => { try{ localStorage.setItem(cartKey, JSON.stringify(cart)); }catch(e){} };

function show(id){ ["#v-menu","#v-checkout","#v-note"].forEach(s => $(s).hidden = s !== id); scrollTo(0, 0); }
function note(html){ $("#note").innerHTML = html; show("#v-note"); }

async function api(action, extra={}){
  const res = await fetch(`${CFG.supabase.url}/functions/v1/${ORDER.function}`, {
    method:"POST",
    headers:{"Content-Type":"application/json", apikey:CFG.supabase.anonKey, Authorization:`Bearer ${CFG.supabase.anonKey}`},
    body: JSON.stringify({action, ...LINK, ...extra}),
  });
  const body = await res.json().catch(() => ({ok:false, error:"Couldn't reach the shop. Check your internet and try again."}));
  if (!body.ok) throw new Error(body.error || "Something went wrong.");
  return body;
}

/* ---------- Menu ---------- */
async function loadMenu(){
  const url = `${CFG.supabase.url}/rest/v1/menu_items?select=id,category,name,description,price_zar,sold_out,sort_order&order=sort_order.asc,name.asc`;
  const res = await fetch(url, {headers:{apikey:CFG.supabase.anonKey, Authorization:`Bearer ${CFG.supabase.anonKey}`}});
  if (!res.ok) throw new Error("menu");
  menu = (await res.json()).map(m => ({...m, price_zar:Number(m.price_zar)}));
  for (const id of Object.keys(cart)) if (!menu.some(m => m.id === id && !m.sold_out)) delete cart[id];
}
const cats = () => [...new Set(menu.map(m => m.category))];
function renderMenu(){
  const list = cats();
  $("#cats").innerHTML = list.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(CAT_NAME[c] || c)}</button>`).join("");
  $("#cats").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    cat = b.dataset.cat; renderMenu();
    document.getElementById("sec-" + cat)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  });
  $("#menu").innerHTML = list.map(c => `<h2 class="section-title" id="sec-${esc(c)}" style="scroll-margin-top:64px">${esc(CAT_NAME[c] || c)}</h2>
    <div class="menu">${menu.filter(m => m.category === c).map(m => {
      const q = cart[m.id] || 0;
      return `<div class="item${m.sold_out ? " out" : ""}${q ? " in-cart" : ""}">
        <b>${esc(m.name)}</b>
        <div class="step">${q ? `<button data-id="${esc(m.id)}" data-d="-1" aria-label="One less ${esc(m.name)}">−</button><span class="num" aria-live="polite">${q}</span>` : ""}
          ${m.sold_out ? "" : `<button class="add" data-id="${esc(m.id)}" data-d="1" aria-label="Add ${esc(m.name)}">+</button>`}</div>
        ${m.description ? `<span class="desc">${esc(m.description)}</span>` : ""}
        <span class="price num">${R(m.price_zar)}</span>
      </div>`; }).join("")}</div>`).join("");
  $("#menu").querySelectorAll(".step button").forEach(b => b.onclick = () => {
    const id = b.dataset.id; cart[id] = Math.min(20, Math.max(0, (cart[id] || 0) + Number(b.dataset.d)));
    if (!cart[id]) delete cart[id];
    saveCart(); renderMenu();
  });
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  $("#cart-count").textContent = n ? `${n} item${n === 1 ? "" : "s"} · Checkout` : "Add something tasty";
  $("#cart-total").textContent = R(subtotalCents() / 100);
  $("#to-checkout").disabled = !n;
}
const byId = id => menu.find(m => m.id === id);
const subtotalCents = () => Object.entries(cart).reduce((s, [id, q]) => s + cents(byId(id)?.price_zar || 0) * q, 0);
const items = () => Object.entries(cart).map(([item_id, qty]) => ({item_id, qty}));

/* ---------- Checkout ---------- */
function payOptions(){
  const o = [["cash", fulfilment === "delivery" ? "Pay on delivery" : "Pay when I collect", "Cash or card at the counter"]];
  if (conf?.pay?.yoco) o.push(["yoco", "Pay now by card", "Visa, Mastercard and more, through Yoco"]);
  if (conf?.pay?.ozow) o.push(["ozow", "Pay now with my bank app", "Instant EFT through Ozow"]);
  if (conf?.pay?.stitch) o.push(["stitch", "PayShap or Capitec Pay", "Pay from your bank app through Stitch"]);
  if (!o.some(([v]) => v === pay)) pay = "cash";
  $("#pay-opts").innerHTML = o.map(([v, l, s]) => `<button class="opt" data-pay="${v}" aria-pressed="${v === pay}">${esc(l)}<small>${esc(s)}</small></button>`).join("");
  $("#pay-opts").querySelectorAll(".opt").forEach(b => b.onclick = () => { pay = b.dataset.pay; payOptions(); renderTotals(); });
}
let quote = null;
function renderTotals(){
  const fee = fulfilment === "delivery" ? cents(conf.deliveryFee) : 0;
  const total = quote ? cents(quote.total) : subtotalCents() + fee;
  $("#sum-lines").innerHTML = (quote ? quote.lines : items().map(i => ({...i, name:byId(i.item_id)?.name, line_total:(byId(i.item_id)?.price_zar || 0) * i.qty})))
    .map(l => `<div class="line"><span>${l.qty} × ${esc(l.name)}</span><span class="num">${R(l.line_total)}</span></div>`).join("")
    + (fee ? `<div class="line"><span>Delivery</span><span class="num">${R(fee / 100)}</span></div>` : "");
  $("#sum-total").textContent = $("#place-total").textContent = R(total / 100);
  $("#place-label").textContent = pay === "cash" ? "Place order" : "Place order & pay";
}
async function refreshQuote(){
  quote = null; renderTotals();
  try{ quote = await api("quote", {items:items(), fulfilment}); renderTotals(); hideErr(); }
  catch(e){ showErr(e.message); }
}
const showErr = m => { $("#err").textContent = m; $("#err").hidden = false; };
const hideErr = () => { $("#err").hidden = true; };

$("#to-checkout").onclick = () => {
  show("#v-checkout");
  $("#collect-at").textContent = CFG.receipt?.address ? "at " + CFG.receipt.address.split(",")[0] : "Free";
  $("#del-fee").textContent = `+${R(conf.deliveryFee)}`;
  if (!$("#c-name").value) $("#c-name").value = (localStorage.getItem("order-name") || conf.name || "").split(" ")[0];
  payOptions(); refreshQuote();
};
$("#back").onclick = () => { show("#v-menu"); renderMenu(); };
document.querySelectorAll("[data-ful]").forEach(b => b.onclick = () => {
  fulfilment = b.dataset.ful;
  document.querySelectorAll("[data-ful]").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("#addr-wrap").hidden = fulfilment !== "delivery";
  payOptions(); refreshQuote();
});

$("#place").onclick = async () => {
  if (busy) return;
  const name = $("#c-name").value.trim(), address = $("#c-addr").value.trim();
  if (!name){ showErr("Please add your name for the order."); $("#c-name").focus(); return; }
  if (fulfilment === "delivery" && address.length < 5){ showErr("Please add your delivery address."); $("#c-addr").focus(); return; }
  busy = true; $("#place").disabled = true; $("#place-label").textContent = "Placing your order…"; hideErr();
  try{
    const r = await api("place", {items:items(), fulfilment, address, name, note:$("#c-note").value.trim(), pay});
    try{ localStorage.setItem("order-name", name); localStorage.removeItem(cartKey); }catch(e){}
    cart = {};
    if (r.pay_url){ location.href = r.pay_url; return; }
    done(r);
  }catch(e){
    showErr(e.message);
    busy = false; $("#place").disabled = false; renderTotals();
  }
};

function done(r){
  const wa = waLink(`Hi ${SHOP}! I just placed order #${r.order_number}.`);
  note(`<div class="tick" aria-hidden="true">✓</div>
    <h2>Order #${esc(r.order_number)} is in!</h2>
    <p>${r.duplicate ? "We already had this order, so we didn't add it twice. " : ""}We've sent your receipt on WhatsApp and we'll message you when it's on the fire and when it's ready.${r.pay_error ? " " + esc(r.pay_error) : ""}</p>
    <p class="num"><b>${R(r.total)}</b> · ${fulfilment === "delivery" ? "pay on delivery" : "pay when you collect"}</p>
    ${wa ? `<a class="btn-wa" href="${esc(wa)}">Back to WhatsApp</a>` : ""}`);
}

/* ---------- Back from a payment page: wait for the bank's confirmation ---------- */
async function waitForPayment(orderId){
  note(`<div class="tick wait" aria-hidden="true">R</div><h2>Checking your payment</h2><p>This takes a few seconds. Please keep this page open.</p>`);
  for (let i = 0; i < 30; i++){
    try{
      const s = await api("status", {order_id:orderId});
      if (s.paid){
        const wa = waLink(`Hi ${SHOP}! I paid for order #${s.order_number}.`);
        note(`<div class="tick" aria-hidden="true">✓</div><h2>Paid! Order #${esc(s.order_number)}</h2>
          <p>Thank you. Your payment of <b class="num">${R(s.total)}</b> came through and your order is with the kitchen.</p>
          ${wa ? `<a class="btn-wa" href="${esc(wa)}">Back to WhatsApp</a>` : ""}`);
        return;
      }
      if (i === 29) throw new Error("not yet");
    }catch(e){ if (i === 29) break; }
    await new Promise(r => setTimeout(r, 3000));
  }
  const wa = waLink(`Hi ${SHOP}! I tried to pay for my order online.`);
  note(`<div class="tick wait" aria-hidden="true">…</div><h2>Payment not confirmed yet</h2>
    <p>Your order is placed. If you paid, the kitchen will see it as soon as your bank confirms. If the payment didn't go through, you can pay when you collect.</p>
    ${wa ? `<a class="btn-wa" href="${esc(wa)}">Back to WhatsApp</a>` : ""}`);
}

/* ---------- Start ---------- */
(async () => {
  if (!CFG.supabase || !ORDER.function){ note(`<h2>Ordering isn't set up</h2><p>This shop hasn't switched on online ordering yet.</p>`); return; }
  try{ conf = await api("config"); }catch(e){ note(`<h2>Can't reach ${esc(SHOP)}</h2><p>${esc(e.message)}</p>`); return; }
  if (!conf.linkOk){
    const wa = waLink("Hi! I'd like to order.");
    note(`<h2>Open this from WhatsApp</h2><p>To order, send ${esc(SHOP)} a message on WhatsApp and tap the <b>Order</b> button in the reply. That links your order to your number, so we can send your receipt.</p>
      ${wa ? `<a class="btn-wa" href="${esc(wa)}">Message ${esc(SHOP)} on WhatsApp</a>` : ""}`);
    return;
  }
  const back = q.get("r");
  if (back){ waitForPayment(back); return; }
  show("#v-menu");
  try{ await loadMenu(); }catch(e){ $("#menu").innerHTML = `<p class="err">Couldn't load the menu. Check your internet and refresh.</p>`; return; }
  cat = cats()[0] || null; renderMenu();
})();
</script>
</body>
</html>
